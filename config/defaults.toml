# Later task instructions > course config > these defaults.
language = "en"
depth = "balanced_high_yield" # cram | focused_learning | balanced_high_yield | thorough
# A standalone build defaults to the detailed edition. Agent authoring normally
# delivers both focused_learning and balanced_high_yield; see the guidelines.
visuals = "smart" # off | slide_only | smart
visual_density = "adaptive" # low | adaptive | high; authoring guidance, never a quota
allow_web_visuals = true # only locally downloaded, credited, permitted assets
theme_accent = "auto" # auto | teal | violet | blue | green | #RRGGBB
include_review_mode = true
practice = "off" # only supported value; no question system
source_labels = "minimal" # minimal | off
course_title = "" # empty uses JSON title
output_filename = "Study_Suite.html"
# exam_days_left = 3 # optional authoring hint, not a length limit
